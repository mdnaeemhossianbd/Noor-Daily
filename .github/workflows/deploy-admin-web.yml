name: Deploy Noor Daily Admin Web to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'backend/**'
      - 'firebase.json'

jobs:
  deploy_admin:
    name: Build & Deploy React Admin Dashboard
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }} # 👈 এই লাইনটি নতুন যোগ করা হয়েছে

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'admin/package.json'

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci || npm install

      - name: Build Web Production Assets
        working-directory: ./admin
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyB16zMcqdcnfbkPRjOmmRmeJZMwalVlBMU' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'gen-lang-client-0048418625.firebaseapp.com' }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL || 'https://gen-lang-client-0048418625-default-rtdb.asia-southeast1.firebasedatabase.app' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'gen-lang-client-0048418625' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'gen-lang-client-0048418625.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '585883427862' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:585883427862:web:admin' }}
        run: npm run build

      - name: Deploy to Firebase Hosting (when secret configured)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''  # 👈 স্পেস এবং env ঠিক করা হয়েছে
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: "${{ secrets.VITE_FIREBASE_PROJECT_ID || 'gen-lang-client-0048418625' }}"

      - name: Skip Firebase Hosting Deploy (when secret not configured)
        if: env.FIREBASE_SERVICE_ACCOUNT == ''  # 👈 স্পেস এবং env ঠিক করা হয়েছে
        run: |                                  # 👈 স্পেস ঠিক করা হয়েছে
          echo "Notice: FIREBASE_SERVICE_ACCOUNT is not configured in GitHub Repository Secrets."
          echo "React Admin bundle built successfully into admin/dist."
          echo "If hosting on Vercel, this build is ready. To enable automated Firebase Hosting deploy, add FIREBASE_SERVICE_ACCOUNT to your GitHub Secrets."