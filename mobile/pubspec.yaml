
name: noor_daily
description: "A premium Islamic application with dynamic content, prayer times, and community guidance."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^3.12.1
  firebase_database: ^11.3.5
  cloud_firestore: ^5.6.5
  firebase_remote_config: ^5.4.3
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  adhan: ^2.0.0+1
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  google_mobile_ads: 9.1.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
