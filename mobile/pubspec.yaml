name: noor_daily
description: "A premium Islamic application with dynamic content, prayer times, and community guidance."
publish_to: "none"
version: 1.0.0+1
firebase_database: ^11.3.5

environment:
  sdk: ">=3.3.0 <4.0.0"

  dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_database: ^11.3.5

  # Firebase Core, Firestore, and Remote Config
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_remote_config: ^5.4.3

  # State Management and Persistence
  provider: ^6.1.2
  shared_preferences: ^2.5.2

  # Prayer Times & Location
  adhan: ^2.1.0
  geolocator: ^13.0.2

  # Android Local Notifications & Exact Alarms
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Google Mobile Ads (AdMob)
  google_mobile_ads: ^5.2.0

  # UI and Media
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
